<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - Hindi-Tamil Language Translation Application</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="auth-page">
<main class="auth-card">
    <div class="logo">अ→அ</div>
    <h1>Welcome back</h1>
    <p class="subtitle">Log in to the Hindi-Tamil Language Translation Application</p>

    <div class="alert success" th:if="${param.registered}">
        Registration successful! Please log in.
    </div>
    <div class="alert success" th:if="${param.logout}">
        You have been logged out.
    </div>
    <div class="alert error" th:if="${param.error}">
        Invalid email or password. Please try again.
    </div>

    <form th:action="@{/login}" method="post">
        <label for="email">Email address</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required autofocus>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Your password" required>

        <button type="submit" class="btn primary full">Login</button>
    </form>

    <p class="switch-link">New here? <a th:href="@{/register}">Create an account</a></p>
</main>
</body>
</html>
