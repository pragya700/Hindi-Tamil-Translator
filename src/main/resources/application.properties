# ---------- Application ----------
spring.application.name=hindi-tamil-translator
server.port=8080

# ---------- Local secrets file (NOT committed to Git) ----------
# If application-local.properties exists, its values override the ones below.
spring.config.import=optional:classpath:application-local.properties

# ---------- MySQL datasource ----------
# Values can come from environment variables, or from application-local.properties.
# The database is created automatically if it does not exist.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hindi_tamil_translator?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# ---------- JPA / Hibernate ----------
# update = create/alter tables automatically from @Entity classes (fine for learning)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---------- UTF-8 so Hindi and Tamil text is never garbled ----------
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false
